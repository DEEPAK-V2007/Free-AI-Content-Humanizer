<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanize - Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.15) 0%, transparent 100%),
                radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.1) 0%, transparent 100%),
                radial-gradient(1px 1px at 50% 70%, rgba(255,255,255,0.1) 0%, transparent 100%),
                radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.08) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.08) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            animation: fadeInDown 0.6s ease forwards;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .header-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-name {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #a78bfa, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 4px;
            color: rgba(160, 140, 200, 0.6);
            text-transform: uppercase;
        }

        .main-content {
            display: flex;
            gap: 20px;
            flex: 1;
            animation: fadeInUp 0.6s ease 0.2s forwards;
            opacity: 0;
        }

        .panels-wrapper {
            display: flex;
            gap: 20px;
            flex: 1;
        }

        .text-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel-label {
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #60a5fa;
            text-transform: uppercase;
            text-align: center;
        }

        .panel-label.humanized {
            color: #60a5fa;
        }

        .text-box {
            flex: 1;
            min-height: 450px;
            background: rgba(20, 10, 60, 0.85);
            border: 1px solid rgba(100, 80, 180, 0.3);
            border-radius: 12px;
            padding: 24px;
            color: rgba(200, 190, 230, 0.85);
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.7;
            overflow-y: auto;
        }

        .text-box::-webkit-scrollbar {
            width: 4px;
        }

        .text-box::-webkit-scrollbar-track {
            background: rgba(30, 20, 70, 0.5);
            border-radius: 4px;
        }

        .text-box::-webkit-scrollbar-thumb {
            background: rgba(129, 140, 248, 0.3);
            border-radius: 4px;
        }

        .buttons-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            min-width: 180px;
        }

        .btn-new {
            padding: 20px 24px;
            background: linear-gradient(135deg, #d946ef, #a855f7);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            line-height: 1.4;
        }

        .btn-new:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #e879f9, #c084fc);
            box-shadow: 0 8px 25px rgba(217, 70, 239, 0.3);
        }

        .btn-new:active {
            transform: translateY(0px);
        }

        .btn-regenerate {
            padding: 20px 24px;
            background: rgba(88, 60, 160, 0.6);
            border: 1px solid rgba(167, 139, 250, 0.4);
            border-radius: 12px;
            color: white;
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
            transition: all 0.3s ease;
            line-height: 1.4;
            width: 100%;
        }

        .btn-regenerate:hover {
            transform: translateY(-2px);
            background: rgba(120, 90, 200, 0.7);
            border-color: rgba(167, 139, 250, 0.7);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.2);
        }

        .btn-regenerate:active {
            transform: translateY(0px);
        }

        .btn-copy {
            padding: 14px 24px;
            background: transparent;
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            color: rgba(96, 165, 250, 0.8);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
            transition: all 0.3s ease;
        }

        .btn-copy:hover {
            background: rgba(96, 165, 250, 0.1);
            border-color: rgba(96, 165, 250, 0.6);
            color: rgba(96, 165, 250, 1);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: rgba(129, 140, 248, 0.25);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        @media (max-width: 768px) {
            .page-wrapper {
                padding: 16px;
                gap: 20px;
            }

            .logo-img {
                width: 50px;
                height: 50px;
            }

            .brand-name {
                font-size: 16px;
                letter-spacing: 3px;
                word-break: break-word;
            }

            .brand-subtitle {
                font-size: 8px;
                letter-spacing: 2px;
            }

            .main-content {
                flex-direction: column;
            }

            .panels-wrapper {
                flex-direction: column;
                gap: 16px;
            }

            .text-box {
                min-height: 220px;
                font-size: 14px;
                padding: 16px;
            }

            .panel-label {
                font-size: 12px;
                letter-spacing: 2px;
            }

            .buttons-panel {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 10px;
                min-width: unset;
                width: 100%;
                justify-content: center;
            }

            .btn-new {
                flex: 1;
                min-width: 130px;
                padding: 14px 10px;
                font-size: 10px;
                letter-spacing: 1px;
            }

            .btn-copy {
                flex: 1;
                min-width: 100px;
                padding: 14px 10px;
                font-size: 12px;
                letter-spacing: 1px;
            }

            .btn-regenerate {
                width: 100%;
                padding: 14px 10px;
                font-size: 10px;
                letter-spacing: 1px;
            }

            .footer-note {
                font-size: 9px;
                letter-spacing: 1px;
            }
        }

        @media (max-width: 400px) {
            .brand-name {
                font-size: 13px;
                letter-spacing: 2px;
                word-break: break-word;
            }

            .logo-img {
                width: 40px;
                height: 40px;
            }

            .text-box {
                min-height: 180px;
                padding: 12px;
            }
        }

    </style>
</head>
<body>
    <div class="page-wrapper">

        <div class="header">
            <img src="{{ url_for('static', filename='LOGO.png') }}" class="logo-img" alt="Humanize Logo">
            <div class="header-text">
                <div class="brand-name">HUMANIZER</div>
                <div class="brand-subtitle">AI Content Humanizer</div>
            </div>
        </div>

        <div class="main-content">

            <div class="panels-wrapper">

                <div class="text-panel">
                    <div class="panel-label">Original Text</div>
                    <div class="text-box">{{ original }}</div>
                </div>

                <div class="text-panel">
                    <div class="panel-label humanized">Humanized Text</div>
                    <div class="text-box">{{ humanized }}</div>
                </div>

            </div>

            <div class="buttons-panel">
                <a href="/" class="btn-new">Try With A New Text</a>
                <button class="btn-copy" onclick="copyText()">Copy Result</button>
                <form action="/retest" method="post" style="width:100%;">
                    <input type="hidden" name="original_text" value="{{ original }}">
                    <button type="submit" class="btn-regenerate">Regenerate The Text Again</button>
                </form>
            </div>

        </div>

        <div class="footer-note">Free · No Sign In · No Limits</div>

    </div>

    <script>
        function copyText() {
            const humanizedText = document.querySelectorAll('.text-box')[1].innerText;
            navigator.clipboard.writeText(humanizedText).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.textContent = 'Copied!';
                btn.style.borderColor = 'rgba(96, 250, 150, 0.6)';
                btn.style.color = 'rgba(96, 250, 150, 0.9)';
                setTimeout(() => {
                    btn.textContent = 'Copy Result';
                    btn.style.borderColor = 'rgba(96, 165, 250, 0.3)';
                    btn.style.color = 'rgba(96, 165, 250, 0.8)';
                }, 2000);
            });
        }
    </script>

</body>
</html>
